<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Vinicius Seixas">
    <meta name="description" content="Junte-se a nós">
    <meta name="keywords"
        content="viagem, exploração, destinos, parques nacionais, montanhas, lagos, fotografia da natureza">
    <title>Around the u.s.</title>
    <link rel="stylesheet" href="./pages/index.css">
</head>

<body>
    <div class="page">
        <!-- Popup Editar Perfil -->
        <div class="popup display__none">
            <div class="popup__content">
                <h3 class="popup__title">Editar perfil</h3>
                <form class="popup__form popup__form-edit" id="form-edit">
                    <input class="popup__edit" id="name" type="text" placeholder="Nomes" required minlength="3">
                    <div class="popup__error-container">
                        <span class="popup__form-error popup__form-error_type_name"></span>
                    </div>
                    <input class="popup__edit" id="about" type="text" placeholder="Sobre mim" required minlength="3">
                    <div class="popup__error-container">
                        <span class="popup__form-error popup__form-error_type_about"></span>
                    </div>
                    <button class="popup__button" id="savebutton" type="submit" disabled>Salvar</button>
                </form>
                <button class="popup__close-button"></button>
            </div>
        </div>
        <!-- Popup Adicionar Imagem -->
        <div class="popup popup__add-image display__none">
            <div class="popup__content">
                <h3 class="popup__title">Novo Local</h3>
                <form class="popup__form popup__form-add-form" id="form-add">
                    <input class="popup__edit" id="title" type="text" placeholder="Título" required minlength="3">
                    <div class="popup__error-container">
                        <span class="popup__form-error popup__form-error_type_title"></span>
                    </div>
                    <input class="popup__edit" id="image_url" type="url" placeholder="Image URL" required>
                    <div class="popup__error-container">
                        <span class="popup__form-error popup__form-error_type_image_url"></span>
                    </div>
                    <button class="popup__button" id="savebutton-image" type="submit" disabled>Salvar</button>
                </form>
                <button class="popup__close-button"></button>
            </div>
        </div>
        <!-- Popup Mostrar Imagem -->
        <div class="popup popup__show-image display__none">
            <div class="popup__image_content">
                <img src="" class="popup__big-image" alt="">
                <button class="popup__close-button"></button>
                <h3 class="popup__image_footer"></h3>
            </div>
        </div>
        <!-- Popup de Confirmação de Delete -->
        <div class="popup popup__confirm-delete display__none">
            <div class="popup__content">
                <h3 class="popup__title">Tem certeza?</h3>
                <form class="popup__form popup__form-confirm" id="form-confirm">
                    <button class="popup__button" type="submit">Sim</button>
                </form>
                <button class="popup__close-button"></button>
            </div>
        </div>
        <!-- Popup Alterar Avatar -->
        <div class="popup popup__change-avatar display__none">
            <div class="popup__content">
                <h3 class="popup__title">Alterar foto de perfil</h3>
                <form class="popup__form popup__form-avatar" id="form-avatar">
                    <input class="popup__edit" id="avatar_url" type="url" placeholder="Link da imagem" required>
                    <div class="popup__error-container">
                        <span class="popup__form-error popup__form-error_type_avatar_url"></span>
                    </div>
                    <button class="popup__button" type="submit" disabled>Salvar</button>
                </form>
                <button class="popup__close-button"></button>
            </div>
        </div>
        <header class="header">
            <img src="./images/Vector.png" alt="Título Around of the us" class="header__title">
        </header>
        <main class="container">
            <section class="profile">
                <div class="profile__avatar-container">
                    <img src="./images/Avatar.png" alt="Avatar" class="profile__avatar">
                    <div class="profile__avatar-overlay">
                    </div>
                </div>
                <div class="profile__info">
                    <h2 class="profile__name">Jacques Cousteau</h2>
                    <button class="profile__edit-button" id="edit-profile-button"></button>
                    <p class="profile__subtitle">Explorador</p>
                </div>
                <button class="profile__add-button" id="add-card-button"></button>
            </section>
            <section class="element" id="cards-container">
            </section>
            <template id="element-card">
                <div class="element__template">
                    <img src="" class="element__image" alt="">
                    <button class="element__erase" type="button"></button>
                    <div class="element__item">
                        <h2 class="element__title"></h2>
                        <button class="element__like" type="button"></button>
                    </div>
                </div>
            </template>
            <footer class="footer">
                <p class="footer__copyright">© 2024 Around The U.S.</p>
            </footer>
        </main>
    </div>
    <script src="./scripts/index.js" type="module"></script>
</body>

</html>
